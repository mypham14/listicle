<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Tip Details</title>
        <link rel="icon" type="image/svg+xml" href="/logo.svg">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
        <link rel="stylesheet" href="/style.css">
        <script src="/scripts/header.js" defer></script>
        <script src="/scripts/tip.js" defer></script>
    </head>
    <body>
        <header></header>
        <main id="tip-content" class="container tip-info">
            <article>
                <div class="tip-image-wrap">
                    <img id="image" src="" alt="">
                </div>
                <div class="tip-body">
                    <span id="category" class="tip-badge"></span>
                    <h1 id="title"></h1>
                    <p id="submittedBy" class="tip-submitted"></p>
                    <hr>
                    <p id="text" class="tip-text"></p>
                    <a href="/" role="button" class="secondary">Back to All Tips</a>
                </div>
            </article>
        </main>
    </body>
</html>
